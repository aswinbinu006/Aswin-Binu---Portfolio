<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ieeeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00629B"/>
      <stop offset="100%" stop-color="#004771"/>
    </linearGradient>
  </defs>
  <!-- Background Circle for clean avatar presentation -->
  <circle cx="200" cy="200" r="190" fill="url(#ieeeBlue)" />
  
  <!-- Outer Diamond / Kite -->
  <g transform="translate(200, 155) scale(0.95)">
    <polygon points="0,-105 85,0 0,105 -85,0" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />
    
    <!-- Central Induction Circle -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="9" />
    
    <!-- Field Arrow 1: Top arrow pointing right -->
    <path d="M-36,-36 L0,-50 L36,-36" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="36,-36 24,-45 28,-30" fill="#FFFFFF" />
    
    <!-- Field Arrow 2: Bottom arrow pointing left -->
    <path d="M36,36 L0,50 L-36,36" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="-36,36 -24,45 -28,30" fill="#FFFFFF" />
    
    <!-- Right-hand rule vertical axis arrow -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    <polygon points="0,-95 -10,-75 10,-75" fill="#FFFFFF" />
  </g>
  
  <!-- IEEE Official Wordmark Typography -->
  <text x="200" y="325" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="4">IEEE</text>
</svg>
